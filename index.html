<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>弹珠炼金术 · Pinball Alchemy</title>
  <style>
    /* 自定义全局字体 */
    @font-face {
      font-family: 'Alimama FangYuanTi VF Thin';
      src: url('/fonts/AlimamaFangYuanTiVF-Thin-2.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* 简约配色 */
      --bg: #0a0e14;
      --bg-2: #050709;
      --panel: rgba(20, 25, 33, 0.88);
      --panel-solid: #141921;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --gold: #f5c542;
      --gold-dim: #8a6a1a;
      --crystal: #4dd6c1;
      --accent: #ff7a59;
      --accent-2: #6ec5ff;
      --text: #e6edf3;
      --muted: #7d8896;
      --good: #4ade80;
      --bad: #ff6b6b;
      --btn: rgba(255, 255, 255, 0.04);
      --btn-hover: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg-2);
      color: var(--text);
      font-family: 'Alimama FangYuanTi VF Thin', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #game-root {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-2);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* ===== HUD 容器 ===== */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
      font-size: 14px;
      font-feature-settings: 'tnum';
    }
    #hud .pe { pointer-events: auto; }

    /* ===== 顶部状态栏 ===== */
    #top-bar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px; right: 10px;
      display: flex; gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .stat-chip {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      display: flex; gap: 6px; align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
      font-size: 13px;
    }
    .stat-chip svg { width: 14px; height: 14px; }
    .stat-chip.gold { color: var(--gold); border-color: rgba(245, 197, 66, 0.3); }
    .stat-chip.crystal { color: var(--crystal); border-color: rgba(77, 214, 193, 0.3); }
    .stat-chip.ball { color: var(--accent-2); }
    .stat-chip .val { font-weight: 600; min-width: 24px; text-align: right; }
    .stat-chip .rate { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 3px; letter-spacing: 0.3px; transition: color 0.2s; }
    .stat-chip .rate.has { color: var(--good); }

    /* 金币位数进度条（金币左侧） */
    .digit-progress {
      background: var(--panel);
      border: 1px solid rgba(245, 197, 66, 0.3);
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; gap: 3px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
      min-width: 74px;
    }
    .dp-head { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); gap: 6px; }
    .dp-head .dp-target { color: var(--gold); font-weight: 600; }
    .dp-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
    .dp-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 3px; transition: width 0.25s ease; }

    #chapter-tag {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      display: flex; gap: 8px; align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #chapter-tag .progress {
      width: 60px; height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    #chapter-tag .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--crystal), var(--gold));
      transition: width 0.3s;
    }

    .icon-btn {
      pointer-events: auto;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.15s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .icon-btn:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .icon-btn svg { width: 14px; height: 14px; }
    .icon-btn.prestige-btn {
      background: rgba(125, 136, 150, 0.1);
      border-color: rgba(125, 136, 150, 0.3);
      color: var(--muted);
    }
    .icon-btn.prestige-btn:hover { background: rgba(125, 136, 150, 0.18); }
    .icon-btn.prestige-btn.ready {
      background: rgba(245, 197, 66, 0.22);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
      animation: prestigePulse 1.6s ease-in-out infinite;
    }
    .icon-btn.prestige-btn.ready:hover { background: rgba(245, 197, 66, 0.32); }
    @keyframes prestigePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 197, 66, 0.45); }
      50% { box-shadow: 0 0 0 5px rgba(245, 197, 66, 0); }
    }

    /* ===== 悬浮商店抽屉（底部居中，向上展开）===== */
    .side-panel {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: min(560px, calc(100vw - 24px));
      height: 70vh;
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0;
      overflow: hidden;
      pointer-events: auto;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      /* 收起态：向下平移自身高度减去标题条高度（用 100% 相对自身，避免 vh 与 max-height 不一致）*/
      transform: translateX(-50%) translateY(calc(100% - 44px));
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 15;
    }
    /* 展开态：复位 */
    .side-panel:not(.collapsed) {
      transform: translateX(-50%) translateY(0);
    }
    #left-panel { left: 50%; }

    /* 展开遮罩：点击收起 */
    .shop-backdrop {
      position: fixed; inset: 0;
      background: rgba(5, 7, 9, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
      z-index: 14;
    }
    .shop-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .panel-title {
      font-size: 13px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      margin: 0;
      letter-spacing: 0.5px;
      font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .panel-title:hover { background: rgba(255,255,255,0.03); }
    .panel-title svg { width: 14px; height: 14px; color: var(--gold); }
    .collapse-btn {
      margin-left: auto;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: transform 0.2s, background 0.15s;
      font-family: inherit;
      line-height: 1;
    }
    .collapse-btn:hover { background: var(--btn-hover); color: var(--text); }
    .side-panel.collapsed .collapse-btn { transform: rotate(180deg); }
    .side-panel.collapsed .panel-title { border-bottom: none; }
    .panel-body {
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }
    #shop-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      animation: shopFadeIn 0.2s ease;
    }
    @keyframes shopFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #shop-list::-webkit-scrollbar { width: 6px; }
    #shop-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
    /* 桌面端商品网格 */
    @media (min-width: 641px) {
      #shop-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
      #shop-list .shop-item, #shop-list .skill-item { margin-bottom: 0; }
    }

    /* 商店/技能卡片：简约扁平 */
    .shop-item, .skill-item {
      background: var(--btn);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .shop-item:hover, .skill-item:hover {
      background: var(--btn-hover);
      border-color: var(--border-strong);
    }
    .shop-item:active, .skill-item:active { transform: scale(0.98); }
    .shop-item.locked, .skill-item.locked {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
    .shop-item.locked:hover, .skill-item.locked:hover {
      transform: none;
      background: var(--btn);
    }

    .item-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .item-icon {
      width: 28px; height: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .item-icon svg { width: 16px; height: 16px; }
    .item-icon.peg-icon { border-radius: 50%; }
    .item-name { color: var(--text); font-weight: 500; font-size: 13px; flex: 1; }
    .item-level {
      color: var(--muted); font-size: 11px; font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 8px; border-radius: 4px;
    }
    .item-desc { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 4px 0 6px; }
    .item-effect { color: var(--good); font-size: 11px; font-weight: 500; margin-bottom: 6px; }
    .item-cost {
      color: var(--gold); font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .item-cost.afford { color: var(--good); }
    .item-cost.cant { color: var(--bad); opacity: 0.7; }
    .item-cost svg { width: 12px; height: 12px; }

    /* 双按钮：购买 + 升级速度 */
    .item-actions {
      display: flex; gap: 6px; margin-top: 6px;
    }
    .mini-btn {
      flex: 1;
      background: rgba(245, 197, 66, 0.1);
      border: 1px solid rgba(245, 197, 66, 0.3);
      color: var(--gold);
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }
    .mini-btn:hover:not(:disabled) {
      background: rgba(245, 197, 66, 0.18);
      border-color: var(--gold);
    }
    .mini-btn.speed {
      background: rgba(77, 214, 193, 0.1);
      border-color: rgba(77, 214, 193, 0.3);
      color: var(--crystal);
    }
    .mini-btn.speed:hover:not(:disabled) {
      background: rgba(77, 214, 193, 0.18);
      border-color: var(--crystal);
    }
    .mini-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .mini-btn.maxed {
      background: rgba(125, 136, 150, 0.1);
      border-color: rgba(125, 136, 150, 0.2);
      color: var(--muted);
      cursor: default;
    }

    .tab-row { display: flex; gap: 4px; margin-bottom: 10px; }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 4px;
      cursor: pointer;
      font-size: 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: var(--btn-hover); color: var(--text); }
    .tab-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    /* ===== 模态框 ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(5, 7, 9, 0.85);
      z-index: 100;
      display: none; align-items: center; justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      width: min(440px, 92vw);
      max-height: 86vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .modal h3 {
      color: var(--text); font-size: 18px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
      font-weight: 500;
    }
    .modal h3 svg { width: 18px; height: 18px; color: var(--gold); }
    .modal p { color: var(--text); font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
    .modal .muted { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

    /* 存档槽位卡片 */
    .slot-card {
      background: var(--btn);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.15s;
    }
    .slot-card:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .slot-card.empty { border-style: dashed; opacity: 0.7; }
    .slot-card-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .slot-card-no {
      font-size: 12px; color: var(--muted); font-weight: 500;
      background: rgba(255,255,255,0.06);
      padding: 2px 8px; border-radius: 4px;
    }
    .slot-card-title {
      flex: 1; color: var(--text); font-size: 13px; font-weight: 500;
    }
    .slot-card-meta {
      color: var(--muted); font-size: 11px; line-height: 1.5; margin-bottom: 8px;
    }
    .slot-card-meta .kv { display: inline-flex; gap: 4px; margin-right: 12px; }
    .slot-card-meta .kv b { color: var(--text); font-weight: 500; }
    .slot-card-actions { display: flex; gap: 6px; }
    .slot-card-actions .btn { flex: 1; justify-content: center; padding: 7px 10px; font-size: 12px; }
    .slot-card-actions .btn.danger { flex: 0 0 auto; }

    .btn {
      background: var(--btn); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 16px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
    }
    .btn:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .btn svg { width: 14px; height: 14px; }
    .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
    .btn.primary:hover { background: #ffd966; }
    .btn.danger { color: var(--bad); border-color: rgba(255, 107, 107, 0.4); }
    .btn.danger:hover { background: rgba(255, 107, 107, 0.12); }

    /* ===== 提示条 ===== */
    #toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 101;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 90vw;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    #toast svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ===== 响应式适配 ===== */
    /* 平板/小桌面：抽屉略窄 */
    @media (max-width: 1024px) {
      .side-panel { width: min(480px, calc(100vw - 24px)); }
    }
    /* 手机横屏：抽屉占满宽度，高度受限 */
    @media (max-width: 900px) {
      .side-panel { width: calc(100vw - 24px); height: 60vh; }
      .side-panel { transform: translateX(-50%) translateY(calc(100% - 48px)); }
      .side-panel:not(.collapsed) { transform: translateX(-50%) translateY(0); }
      .stat-chip { padding: 6px 10px; font-size: 12px; }
      #chapter-tag { font-size: 11px; padding: 6px 10px; }
    }
    /* 手机竖屏：全面优化 */
    @media (max-width: 640px) {
      /* 顶部状态栏：强制单行，避免换行遮挡游戏 */
      #top-bar {
        gap: 5px;
        top: max(8px, env(safe-area-inset-top));
        left: 8px; right: 8px;
        flex-wrap: nowrap;
        overflow: hidden;
      }
      .stat-chip {
        padding: 5px 8px;
        font-size: 11px;
        gap: 4px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .stat-chip svg { width: 11px; height: 11px; }
      .stat-chip .val { min-width: 18px; }
      .stat-chip .rate { font-size: 9px; margin-left: 2px; }
      /* 位数进度条更紧凑 */
      .digit-progress {
        min-width: 52px;
        padding: 4px 6px;
        gap: 2px;
        flex-shrink: 0;
      }
      .dp-head { font-size: 8px; gap: 4px; }
      .dp-track { height: 4px; }
      /* 章节标签隐藏，腾出空间 */
      #chapter-tag { display: none; }
      /* 按钮：只显示图标，触摸热区足够 */
      .icon-btn {
        padding: 7px 9px;
        font-size: 0;
        gap: 0;
        flex-shrink: 0;
      }
      .icon-btn svg { width: 15px; height: 15px; }
      .icon-btn span:not([id^="icon"]) { display: none; }

      /* 抽屉：全宽 + 安全区适配（100% 相对自身高度，与 max-height 协同正确）*/
      .side-panel {
        width: 100vw;
        height: 78vh;
        max-height: calc(100vh - env(safe-area-inset-top) - 60px);
        border-radius: 14px 14px 0 0;
        border-left: none;
        border-right: none;
        padding-bottom: env(safe-area-inset-bottom);
        transform: translateX(-50%) translateY(calc(100% - 52px));
      }
      .side-panel:not(.collapsed) {
        transform: translateX(-50%) translateY(0);
      }
      /* 标题条：触摸热区 52px */
      .panel-title {
        padding: 16px 16px;
        font-size: 14px;
        min-height: 52px;
      }
      .panel-title svg { width: 16px; height: 16px; }
      .collapse-btn { font-size: 14px; padding: 4px 8px; }
      .panel-body { padding: 10px 12px 12px; }

      /* tab 按钮：触摸热区增大 */
      .tab-row { gap: 5px; margin-bottom: 10px; }
      .tab-btn {
        padding: 9px 4px;
        font-size: 12px;
        min-height: 38px;
      }

      /* 商品卡片：触控优化 */
      #shop-list { grid-template-columns: 1fr !important; gap: 8px; }
      .shop-item, .skill-item {
        padding: 12px;
        margin-bottom: 0;
      }
      .item-head { gap: 10px; margin-bottom: 6px; }
      .item-icon { width: 32px; height: 32px; }
      .item-icon svg { width: 18px; height: 18px; }
      .item-name { font-size: 14px; }
      .item-level { font-size: 11px; padding: 3px 9px; }
      .item-desc { font-size: 12px; margin: 5px 0 8px; }
      .item-cost { font-size: 13px; }
      .item-cost svg { width: 13px; height: 13px; }

      /* 双按钮：高度增大便于触控 */
      .item-actions { gap: 8px; margin-top: 8px; }
      .mini-btn {
        padding: 9px 6px;
        font-size: 12px;
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 模态框：移动端接近全屏 */
      .modal-overlay { padding: 12px; }
      .modal {
        width: 100%;
        max-width: 100%;
        padding: 18px 16px;
        padding-bottom: max(18px, env(safe-area-inset-bottom));
      }
      .modal h3 { font-size: 17px; margin-bottom: 14px; }
      .modal p { font-size: 13px; }
      .modal-actions { gap: 8px; margin-top: 18px; }
      .modal-actions .btn {
        flex: 1;
        padding: 11px 12px;
        font-size: 13px;
        justify-content: center;
        min-height: 44px;
      }

      /* 存档卡片触控优化 */
      .slot-card { padding: 14px; }
      .slot-card-actions .btn {
        min-height: 40px;
        padding: 9px 10px;
      }

      /* toast：避开抽屉标题条 */
      #toast {
        bottom: calc(72px + env(safe-area-inset-bottom));
        font-size: 12px;
        padding: 9px 16px;
        max-width: 88vw;
      }
    }
    /* 极小屏（≤360px）：进一步压缩 */
    @media (max-width: 360px) {
      #top-bar { gap: 4px; left: 6px; right: 6px; }
      .stat-chip { padding: 4px 6px; font-size: 10px; gap: 3px; }
      .stat-chip svg { width: 10px; height: 10px; }
      .stat-chip .rate { display: none; }
      /* 极小屏隐藏位数进度条，腾出空间 */
      .digit-progress { display: none; }
      .icon-btn { padding: 6px 8px; }
      .icon-btn svg { width: 14px; height: 14px; }
      /* 抽屉略矮 */
      .side-panel { height: 80vh; }
      .side-panel { transform: translateX(-50%) translateY(calc(100% - 50px)); }
      .side-panel:not(.collapsed) { transform: translateX(-50%) translateY(0); }
      .panel-title { padding: 14px 12px; font-size: 13px; min-height: 50px; }
      /* 商品卡片更紧凑 */
      .shop-item, .skill-item { padding: 10px; }
      .item-icon { width: 28px; height: 28px; }
      .item-name { font-size: 13px; }
      .item-desc { font-size: 11px; }
      .mini-btn { padding: 8px 4px; font-size: 11px; min-height: 36px; }
      .tab-btn { padding: 8px 2px; font-size: 11px; }
    }
    /* 横屏短屏：抽屉高度更小，但仍可滚动 */
    @media (max-height: 500px) and (orientation: landscape) {
      .side-panel {
        height: 85vh;
        max-height: calc(100vh - env(safe-area-inset-top) - 20px);
        transform: translateX(-50%) translateY(calc(100% - 48px));
      }
      .side-panel:not(.collapsed) { transform: translateX(-50%) translateY(0); }
      /* 横屏短屏压缩顶部状态栏 */
      #top-bar { gap: 4px; top: max(4px, env(safe-area-inset-top)); }
      .stat-chip { padding: 4px 8px; font-size: 11px; }
      .digit-progress { min-width: 48px; padding: 3px 6px; }
      .dp-head { font-size: 8px; }
      .dp-track { height: 3px; }
      #chapter-tag { display: none; }
    }

    /* 面板切换按钮（默认隐藏，移动端显示） */
    .panel-toggle {
      display: none;
      position: absolute;
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .panel-toggle:hover { background: var(--btn-hover); }
    .panel-toggle svg { width: 14px; height: 14px; }
    #toggle-shop { bottom: 80px; left: 10px; }
  </style>
</head>
<body>
  <div id="game-root"></div>

  <div id="hud" style="display:none">
    <div id="top-bar">
      <div id="gold-digit-progress" class="digit-progress" title="当前金币距离下一个位数的进度">
        <div class="dp-head"><span>下一位</span><span id="dp-target" class="dp-target">10</span></div>
        <div class="dp-track"><div id="dp-fill" class="dp-fill" style="width:0%"></div></div>
      </div>
      <div class="stat-chip gold"><span id="icon-gold"></span>金币 <span id="gold-val" class="val">0</span><span id="gold-rate" class="rate">+0/s</span></div>
      <div class="stat-chip crystal"><span id="icon-crystal"></span>数晶 <span id="crystal-val" class="val">0</span></div>
      <div class="stat-chip ball"><span id="icon-ball"></span>初始 <span id="ball-val" class="val">1</span></div>
      <div id="chapter-tag"><span id="icon-chapter"></span><span id="chapter-name">第 1 章</span><div class="progress"><div id="chapter-progress" class="progress-fill" style="width:0%"></div></div></div>
      <button id="btn-prestige" class="icon-btn prestige-btn" title="清零进入下一个周目"><span id="icon-prestige2"></span>归零</button>
      <button id="btn-menu" class="icon-btn"><span id="icon-menu"></span>菜单</button>
    </div>

    <div id="shop-backdrop" class="shop-backdrop"></div>
    <div id="left-panel" class="side-panel collapsed">
      <div class="panel-title"><span id="icon-pegs-dup"></span>商店与技能<span class="collapse-btn">▾</span></div>
      <div class="panel-body">
        <div class="tab-row">
          <button class="tab-btn active" data-tab="pegs">钉子</button>
          <button class="tab-btn" data-tab="autos">自动器</button>
          <button class="tab-btn" data-tab="skills">技能</button>
          <button class="tab-btn" data-tab="global">全局</button>
        </div>
        <div id="shop-list"></div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <div id="modal-prestige" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-prestige"></span>归零试炼</h3>
      <p>累计金币已达到 <span id="prestige-gold" style="color:var(--gold)">0</span>，是否归零进入下一周目？</p>
      <p class="muted">归零后将清空金币、钉子与自动器，但可获得数晶并在永久商店中保留加成。</p>
      <div class="modal-actions">
        <button id="prestige-cancel" class="btn">再想想</button>
        <button id="prestige-confirm" class="btn primary">归零</button>
      </div>
    </div>
  </div>

  <div id="modal-menu" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-save"></span>菜单</h3>
      <p class="muted">版本 1.2.0 · 自动保存到本地浏览器</p>
      <div class="modal-actions">
        <button id="menu-home" class="btn"><span id="icon-home"></span>返回标题</button>
        <button id="menu-save" class="btn primary"><span id="icon-save2"></span>立即保存</button>
        <button id="menu-wipe" class="btn danger"><span id="icon-trash"></span>清空存档</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
