<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>弹珠炼金术 · Pinball Alchemy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --bg-2: #010409;
      --panel: #161b22;
      --panel-2: #1c2330;
      --panel-3: #21262d;
      --border: #30363d;
      --border-strong: #484f58;
      --gold: #f0b429;
      --gold-dim: #9b6f00;
      --crystal: #2db7a3;
      --accent: #d97757;
      --accent-2: #56d4dd;
      --text: #e6edf3;
      --muted: #768390;
      --good: #3fb950;
      --bad: #f85149;
      --warn: #d29922;
      --btn: #21262d;
      --btn-hover: #30363d;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
      --glow-gold: 0 0 12px rgba(240,180,41,0.5);
      --glow-crystal: 0 0 12px rgba(45,183,163,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-2);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }
    #game-root {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(45,183,163,0.05), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(240,180,41,0.05), transparent 50%),
        var(--bg-2);
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      box-shadow: var(--shadow);
    }
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
      font-size: 13px;
      font-feature-settings: 'tnum';
    }
    #hud .pe { pointer-events: auto; }

    /* 顶部状态栏 */
    #top-bar {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      display: flex; gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .stat-chip {
      background: rgba(22,27,34,0.92);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      display: flex; gap: 8px; align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .stat-chip svg { width: 14px; height: 14px; }
    .stat-chip.gold { color: var(--gold); border-color: var(--gold-dim); background: rgba(155,111,0,0.08); }
    .stat-chip.crystal { color: var(--crystal); border-color: var(--crystal); background: rgba(45,183,163,0.08); }
    .stat-chip.ball { color: var(--accent-2); }
    .stat-chip .val { font-weight: 700; min-width: 24px; text-align: right; }
    #chapter-tag {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      background: rgba(22,27,34,0.92);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      display: flex; gap: 6px; align-items: center;
    }
    #chapter-tag .progress {
      width: 60px; height: 4px;
      background: var(--panel-3);
      border-radius: 2px;
      overflow: hidden;
    }
    #chapter-tag .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--crystal), var(--gold));
      transition: width 0.3s;
    }
    .icon-btn {
      pointer-events: auto;
      background: rgba(22,27,34,0.92);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      font-family: inherit;
      font-size: 12px;
      transition: all 0.1s;
    }
    .icon-btn:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .icon-btn svg { width: 14px; height: 14px; }

    /* 侧边面板 */
    .side-panel {
      position: absolute;
      top: 56px;
      width: 240px;
      max-height: calc(100vh - 120px);
      background: rgba(22,27,34,0.95);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }
    #left-panel { left: 10px; }
    #right-panel { right: 10px; }
    .panel-title {
      font-size: 11px;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .panel-title svg { width: 14px; height: 14px; }

    .shop-item, .skill-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.12s;
      position: relative;
    }
    .shop-item:hover, .skill-item:hover {
      background: var(--panel-2);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    .shop-item:active, .skill-item:active { transform: translateY(0); }
    .shop-item.locked, .skill-item.locked {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }
    .shop-item.locked:hover, .skill-item.locked:hover { transform: none; background: var(--panel); }
    .item-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .item-icon {
      width: 28px; height: 28px;
      background: var(--panel-3);
      border: 1px solid var(--border);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .item-icon svg { width: 16px; height: 16px; }
    .item-icon.peg-icon { border-radius: 50%; }
    .item-name { color: var(--text); font-weight: 700; font-size: 13px; flex: 1; }
    .item-level { color: var(--muted); font-size: 11px; font-weight: 500; }
    .item-desc { color: var(--muted); font-size: 11px; line-height: 1.4; margin: 2px 0 6px; }
    .item-effect { color: var(--good); font-size: 11px; font-weight: 600; margin-bottom: 4px; }
    .item-cost {
      color: var(--gold); font-size: 12px; font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }
    .item-cost.afford { color: var(--good); }
    .item-cost.cant { color: var(--bad); opacity: 0.7; }
    .item-cost svg { width: 12px; height: 12px; }
    .tab-row { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab-btn {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 4px;
      cursor: pointer;
      font-size: 11px;
      border-radius: 5px;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.1s;
    }
    .tab-btn:hover { background: var(--panel-2); color: var(--text); }
    .tab-btn.active {
      background: var(--gold-dim);
      color: #000;
      border-color: var(--gold);
    }

    /* 主动技能栏 */
    #active-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .active-slot {
      width: 56px; height: 56px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.1s;
    }
    .active-slot:hover { border-color: var(--border-strong); }
    .active-slot.ready {
      border-color: var(--gold);
      box-shadow: var(--glow-gold);
    }
    .active-slot.active-now { border-color: var(--accent); box-shadow: 0 0 12px rgba(217,119,87,0.6); }
    .active-slot .icon-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .active-slot .icon-wrap svg { width: 26px; height: 26px; }
    .active-slot .cooldown {
      position: absolute; left: 0; bottom: 0; width: 100%;
      background: rgba(1,4,9,0.85);
      transition: height 0.1s linear;
    }
    .active-slot .key-hint {
      position: absolute; bottom: 3px; right: 4px;
      font-size: 9px; color: var(--muted);
      background: rgba(0,0,0,0.6); padding: 1px 3px; border-radius: 3px;
    }
    .active-slot .dur-bar {
      position: absolute; left: 0; top: 0; height: 3px;
      background: var(--accent); transition: width 0.1s linear;
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(1,4,9,0.82);
      z-index: 100;
      display: none; align-items: center; justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      width: min(420px, 92vw);
      max-height: 86vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .modal h3 {
      color: var(--gold); font-size: 16px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .modal h3 svg { width: 18px; height: 18px; }
    .modal p { color: var(--text); font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
    .modal .muted { color: var(--muted); font-size: 12px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .btn {
      background: var(--btn); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 14px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.1s;
    }
    .btn:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .btn svg { width: 14px; height: 14px; }
    .btn.primary { background: var(--gold-dim); color: #000; border-color: var(--gold); }
    .btn.primary:hover { background: var(--gold); }
    .btn.danger { color: var(--bad); border-color: var(--bad); }
    .btn.danger:hover { background: rgba(248,81,73,0.12); }

    /* 提示条 */
    #toast {
      position: fixed; bottom: 88px; left: 50%;
      transform: translateX(-50%);
      background: rgba(22,27,34,0.96);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 101;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 6px;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    #toast svg { width: 14px; height: 14px; }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* 移动端适配 */
    @media (max-width: 900px) {
      .side-panel { width: 180px; top: 80px; }
      #right-panel { right: 6px; }
      #left-panel { left: 6px; }
      .active-slot { width: 48px; height: 48px; }
    }
    @media (max-width: 640px) {
      #top-bar { gap: 6px; }
      .stat-chip { padding: 5px 8px; font-size: 11px; }
      .side-panel { display: none; }
      #active-bar { gap: 6px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="game-root"></div>

  <div id="hud" style="display:none">
    <div id="top-bar">
      <div class="stat-chip gold"><span id="icon-gold"></span>金币 <span id="gold-val" class="val">0</span></div>
      <div class="stat-chip crystal"><span id="icon-crystal"></span>数晶 <span id="crystal-val" class="val">0</span></div>
      <div class="stat-chip ball"><span id="icon-ball"></span>初始 <span id="ball-val" class="val">1</span></div>
      <div id="chapter-tag"><span id="icon-chapter"></span><span id="chapter-name">第 1 章</span><div class="progress"><div id="chapter-progress" class="progress-fill" style="width:0%"></div></div></div>
      <button id="btn-menu" class="icon-btn"><span id="icon-menu"></span>菜单</button>
    </div>

    <div id="left-panel" class="side-panel">
      <div class="panel-title"><span id="icon-pegs"></span>钉子商店</div>
      <div class="tab-row">
        <button class="tab-btn active" data-tab="pegs">钉子</button>
        <button class="tab-btn" data-tab="autos">自动器</button>
        <button class="tab-btn" data-tab="global">全局</button>
      </div>
      <div id="shop-list"></div>
    </div>

    <div id="right-panel" class="side-panel">
      <div class="panel-title"><span id="icon-skills"></span>升级与技能</div>
      <div id="skill-list"></div>
    </div>

    <div id="active-bar"></div>
    <div id="toast"></div>
  </div>

  <div id="modal-prestige" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-prestige"></span>归零试炼</h3>
      <p>累计金币已达到 <span id="prestige-gold" style="color:var(--gold)">0</span>，是否归零进入下一周目？</p>
      <p class="muted">归零后将清空金币、钉子与自动器，但可获得数晶并在永久商店中保留加成。</p>
      <div class="modal-actions">
        <button id="prestige-cancel" class="btn">再想想</button>
        <button id="prestige-confirm" class="btn primary">归零</button>
      </div>
    </div>
  </div>

  <div id="modal-ending" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-ending"></span>命运抉择</h3>
      <p>金币已达 <span id="ending-gold" style="color:var(--gold)">1e15</span>。贤者机器轰鸣，你必须做出选择。</p>
      <p class="muted">选择归零将获得救赎；继续追逐无限，世界将因熵增崩坏。</p>
      <div class="modal-actions">
        <button id="ending-reset" class="btn primary">归零</button>
        <button id="ending-continue" class="btn danger">继续积累</button>
      </div>
    </div>
  </div>

  <div id="modal-menu" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-save"></span>菜单</h3>
      <p class="muted">版本 0.1.0 · 自动保存到本地浏览器</p>
      <div class="modal-actions">
        <button id="menu-home" class="btn"><span id="icon-home"></span>返回标题</button>
        <button id="menu-save" class="btn primary"><span id="icon-save2"></span>立即保存</button>
        <button id="menu-wipe" class="btn danger"><span id="icon-trash"></span>清空存档</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
