<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>弹珠炼金术 · Pinball Alchemy</title>
  <style>
    /* 全局字体：Z Labs RoundPix 像素字体 */
    @import url("https://fontsapi.zeoseven.com/995/main/result.css");

    :root {
      /* 简约配色 */
      --bg: #0a0e14;
      --bg-2: #050709;
      --panel: rgba(20, 25, 33, 0.88);
      --panel-solid: #141921;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --gold: #f5c542;
      --gold-dim: #8a6a1a;
      --crystal: #4dd6c1;
      --accent: #ff7a59;
      --accent-2: #6ec5ff;
      --text: #e6edf3;
      --muted: #7d8896;
      --good: #4ade80;
      --bad: #ff6b6b;
      --btn: rgba(255, 255, 255, 0.04);
      --btn-hover: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg-2);
      color: var(--text);
      font-family: "Z Labs RoundPix 12px M CN", 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-weight: normal;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #game-root {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-2);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* ===== HUD 容器 ===== */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
      font-size: 14px;
      font-feature-settings: 'tnum';
    }
    #hud .pe { pointer-events: auto; }

    /* ===== 顶部状态栏 ===== */
    #top-bar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px; right: 10px;
      display: flex; gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .stat-chip {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      display: flex; gap: 6px; align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
      font-size: 13px;
    }
    .stat-chip svg { width: 14px; height: 14px; }
    .stat-chip.gold { color: var(--gold); border-color: rgba(245, 197, 66, 0.3); }
    .stat-chip.crystal { color: var(--crystal); border-color: rgba(77, 214, 193, 0.3); }
    .stat-chip.ball { color: var(--accent-2); }
    .stat-chip .val { font-weight: 600; min-width: 24px; text-align: right; }
    .stat-chip .rate { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 3px; letter-spacing: 0.3px; transition: color 0.2s; }
    .stat-chip .rate.has { color: var(--good); }

    /* 金币位数进度条（金币左侧） */
    .digit-progress {
      background: var(--panel);
      border: 1px solid rgba(245, 197, 66, 0.3);
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column; gap: 3px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
      min-width: 74px;
    }
    .dp-head { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); gap: 6px; }
    .dp-head .dp-target { color: var(--gold); font-weight: 600; }
    .dp-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
    .dp-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 3px; transition: width 0.25s ease; }

    #chapter-tag {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      display: flex; gap: 8px; align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #chapter-tag .progress {
      width: 60px; height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    #chapter-tag .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--crystal), var(--gold));
      transition: width 0.3s;
    }

    .icon-btn {
      pointer-events: auto;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.15s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .icon-btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.4); }
    .icon-btn svg { width: 14px; height: 14px; }
    .icon-btn.prestige-btn {
      background: rgba(125, 136, 150, 0.1);
      border-color: rgba(125, 136, 150, 0.3);
      color: var(--muted);
    }
    .icon-btn.prestige-btn:hover { background: rgba(125, 136, 150, 0.18); }
    .icon-btn.prestige-btn.ready {
      background: rgba(245, 197, 66, 0.22);
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 600;
      animation: prestigePulse 1.6s ease-in-out infinite;
    }
    .icon-btn.prestige-btn.ready:hover { background: rgba(245, 197, 66, 0.32); }
    @keyframes prestigePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 197, 66, 0.45); }
      50% { box-shadow: 0 0 0 5px rgba(245, 197, 66, 0); }
    }
    .icon-btn.boss-btn {
      background: rgba(255, 107, 107, 0.15);
      border-color: rgba(255, 107, 107, 0.4);
      color: #ff8b8b;
    }
    .icon-btn.boss-btn:hover { background: rgba(255, 107, 107, 0.25); }
    .icon-btn.boss-btn.ready {
      background: rgba(255, 107, 107, 0.28);
      border-color: var(--bad);
      color: var(--bad);
      font-weight: 600;
      animation: bossPulse 1.4s ease-in-out infinite;
    }
    .icon-btn.boss-btn.ready:hover { background: rgba(255, 107, 107, 0.4); }
    @keyframes bossPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(255, 107, 107, 0); }
    }

    /* ===== 悬浮商店抽屉（底部居中，向上展开）===== */
    #left-panel {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: min(560px, calc(100vw - 24px));
      height: 70vh;
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0;
      overflow: hidden;
      pointer-events: auto;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      /* 收起态：先水平居中（translateX(-50%)），再下移露出标题条 */
      transform: translateX(-50%) translateY(calc(100% - 44px));
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 15;
    }
    /* 展开态：复位 */
    #left-panel:not(.collapsed) {
      transform: translateX(-50%) translateY(0);
    }

    /* 展开遮罩：点击收起 */
    .shop-backdrop {
      position: fixed; inset: 0;
      background: rgba(5, 7, 9, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
      z-index: 14;
    }
    .shop-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .panel-title {
      font-size: 13px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      margin: 0;
      letter-spacing: 0.5px;
      font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .panel-title:hover { background: rgba(255,255,255,0.03); }
    .panel-title svg { width: 14px; height: 14px; color: var(--gold); }
    .collapse-btn {
      margin-left: auto;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: transform 0.2s, background 0.15s;
      font-family: inherit;
      line-height: 1;
    }
    .collapse-btn:hover { background: var(--btn-hover); color: var(--text); }
    #left-panel.collapsed .collapse-btn { transform: rotate(180deg); }
    #left-panel.collapsed .panel-title { border-bottom: none; }
    .panel-body {
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }
    #shop-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      animation: shopFadeIn 0.2s ease;
    }
    @keyframes shopFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #shop-list::-webkit-scrollbar { width: 6px; }
    #shop-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
    /* 桌面端商品网格 */
    @media (min-width: 641px) {
      #shop-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
      #shop-list .shop-item, #shop-list .skill-item { margin-bottom: 0; }
    }

    /* 商店/技能卡片：简约扁平 */
    .shop-item, .skill-item {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .shop-item:hover, .skill-item:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.4);
    }
    .shop-item:active, .skill-item:active { transform: scale(0.98); }
    .shop-item.locked, .skill-item.locked {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
    .shop-item.locked:hover, .skill-item.locked:hover {
      transform: none;
      background: transparent;
    }

    .item-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .item-icon {
      width: 28px; height: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .item-icon svg { width: 16px; height: 16px; }
    .item-icon.peg-icon { border-radius: 50%; }
    .item-name { color: var(--text); font-weight: 500; font-size: 13px; flex: 1; }
    .item-level {
      color: var(--muted); font-size: 11px; font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 8px; border-radius: 4px;
    }
    .item-desc { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 4px 0 6px; }
    .item-effect { color: var(--good); font-size: 11px; font-weight: 500; margin-bottom: 6px; }
    .item-cost {
      color: var(--gold); font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .item-cost.afford { color: var(--good); }
    .item-cost.cant { color: var(--bad); opacity: 0.7; }
    .item-cost svg { width: 12px; height: 12px; }

    /* 双按钮：购买 + 升级速度 */
    .item-actions {
      display: flex; gap: 6px; margin-top: 6px;
    }
    .mini-btn {
      flex: 1;
      background: rgba(245, 197, 66, 0.1);
      border: 1px solid rgba(245, 197, 66, 0.3);
      color: var(--gold);
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }
    .mini-btn:hover:not(:disabled) {
      background: rgba(245, 197, 66, 0.18);
      border-color: var(--gold);
    }
    .mini-btn.speed {
      background: rgba(77, 214, 193, 0.1);
      border-color: rgba(77, 214, 193, 0.3);
      color: var(--crystal);
    }
    .mini-btn.speed:hover:not(:disabled) {
      background: rgba(77, 214, 193, 0.18);
      border-color: var(--crystal);
    }
    .mini-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .mini-btn.maxed {
      background: rgba(125, 136, 150, 0.1);
      border-color: rgba(125, 136, 150, 0.2);
      color: var(--muted);
      cursor: default;
    }

    .tab-row { display: flex; gap: 4px; margin-bottom: 10px; }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 4px;
      cursor: pointer;
      font-size: 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); border-color: rgba(255,255,255,0.4); }
    .tab-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    /* ===== 模态框 ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(5, 7, 9, 0.85);
      z-index: 100;
      display: none; align-items: center; justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      width: min(440px, 92vw);
      max-height: 86vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .modal h3 {
      color: var(--text); font-size: 18px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
      font-weight: 500;
    }
    .modal h3 svg { width: 18px; height: 18px; color: var(--gold); }
    .modal p { color: var(--text); font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
    .modal .muted { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

    /* 存档槽位卡片 */
    .slot-card {
      background: var(--btn);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
      transition: all 0.15s;
    }
    .slot-card:hover { background: var(--btn-hover); border-color: var(--border-strong); }
    .slot-card.empty { border-style: dashed; opacity: 0.7; }
    .slot-card-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .slot-card-no {
      font-size: 12px; color: var(--muted); font-weight: 500;
      background: rgba(255,255,255,0.06);
      padding: 2px 8px; border-radius: 4px;
    }
    .slot-card-title {
      flex: 1; color: var(--text); font-size: 13px; font-weight: 500;
    }
    .slot-card-meta {
      color: var(--muted); font-size: 11px; line-height: 1.5; margin-bottom: 8px;
    }
    .slot-card-meta .kv { display: inline-flex; gap: 4px; margin-right: 12px; }
    .slot-card-meta .kv b { color: var(--text); font-weight: 500; }
    .slot-card-actions { display: flex; gap: 6px; }
    .slot-card-actions .btn { flex: 1; justify-content: center; padding: 7px 10px; font-size: 12px; }
    .slot-card-actions .btn.danger { flex: 0 0 auto; }

    .btn {
      background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 16px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.4); }
    .btn svg { width: 14px; height: 14px; }
    .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
    .btn.primary:hover { background: #ffd966; border-color: #ffd966; }
    .btn.danger { color: var(--bad); border-color: rgba(255, 107, 107, 0.3); }
    .btn.danger:hover { background: rgba(255, 107, 107, 0.1); border-color: var(--bad); }

    /* ===== 设置弹窗：简约质感 ===== */
    .settings-section {
      display: flex; flex-direction: column; gap: 2px;
      margin: 12px 0;
      padding: 4px 0;
      border-top: 1px solid var(--border);
    }
    .settings-section:first-of-type { border-top: none; }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { color: var(--text); font-size: 13px; }
    .settings-select {
      background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 6px 10px; font-family: inherit; font-size: 12px;
      cursor: pointer; outline: none;
      transition: border-color 0.15s;
    }
    .settings-select:hover { border-color: var(--border-strong); }
    .settings-select:focus { border-color: var(--gold); }
    .settings-select option { background: var(--panel-solid); }
    /* 开关 */
    .toggle {
      width: 38px; height: 22px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative; cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: rgba(245, 197, 66, 0.25); border-color: var(--gold); }
    .toggle-dot {
      position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: var(--muted);
      border-radius: 50%;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .toggle.on .toggle-dot { left: 18px; background: var(--gold); }
    /* 设置按钮：简约白线 */
    .settings-action {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-family: inherit; font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-action:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.04); }
    .settings-action.danger { color: var(--bad); border-color: rgba(255,107,107,0.3); }
    .settings-action.danger:hover { background: rgba(255,107,107,0.1); border-color: var(--bad); }
    .settings-hint { margin-top: 8px; }

    /* ===== 角色图鉴 ===== */
    .codex-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .codex-card {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.2s, background 0.2s;
    }
    .codex-card:hover { border-color: var(--accent-2); background: rgba(255,255,255,0.05); }
    .codex-portrait {
      flex-shrink: 0;
      width: 96px;
      height: 96px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .codex-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }
    .codex-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .codex-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--gold);
    }
    .codex-title {
      font-size: 11px;
      color: var(--accent-2);
      opacity: 0.85;
    }
    .codex-join {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 2px 0 4px;
    }
    .codex-join svg { width: 11px; height: 11px; }
    .codex-desc {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      opacity: 0.82;
    }
    .codex-section-title {
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-2);
      letter-spacing: 0.5px;
      padding: 8px 4px 4px;
      border-bottom: 1px solid var(--border);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .codex-section-title svg { width: 13px; height: 13px; }
    .codex-card.scene-card { flex-direction: column; gap: 8px; }
    .codex-scene-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }
    .codex-scene-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }
    @media (max-width: 640px) {
      .codex-list { grid-template-columns: 1fr; gap: 10px; }
      .codex-portrait { width: 72px; height: 72px; }
      .codex-name { font-size: 14px; }
      .codex-desc { font-size: 11px; }
    }

    /* ===== 左上角任务提示（无边框悬浮） ===== */
    .task-hint {
      position: fixed;
      left: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 64px);
      max-width: 220px;
      padding: 6px 8px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0.2px;
      pointer-events: none;
      z-index: 55;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 1px rgba(0, 0, 0, 0.95);
      opacity: 0;
      transition: opacity 0.3s ease;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .task-hint.show { opacity: 1; }
    .task-hint .task-title {
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      opacity: 0.9;
      letter-spacing: 0.4px;
    }
    .task-hint .task-body { color: rgba(255,255,255,0.82); }
    .task-hint .task-prog {
      display: inline-block;
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
    }
    .task-hint .task-goal {
      display: inline-block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--gold);
      opacity: 0.85;
    }
    @media (max-width: 640px) {
      .task-hint { top: calc(env(safe-area-inset-top, 0px) + 58px); max-width: 46vw; font-size: 11px; }
    }

    /* ===== 提示条 ===== */
    #toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%);
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 101;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 90vw;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    #toast svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ===== 对话覆盖层 ===== */
    .dialogue-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.7) 70%, rgba(0, 0, 0, 0.85) 100%);
      z-index: 90;
      display: none;
      align-items: flex-end;
      justify-content: center;
      pointer-events: auto;
      padding: 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .dialogue-overlay.open { display: flex; animation: dialogueFadeIn 0.25s ease; }
    @keyframes dialogueFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .dialogue-box {
      width: min(640px, 100%);
      background: var(--panel-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      gap: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      animation: dialogueSlideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes dialogueSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .dialogue-portrait {
      width: 80px; height: 80px;
      flex-shrink: 0;
      background-color: rgba(0, 0, 0, 0.4);
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: opacity 0.2s;
    }
    .dialogue-content {
      flex: 1;
      display: flex; flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .dialogue-speaker {
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 1px;
    }
    .dialogue-speaker.narrator {
      color: var(--muted);
      font-style: italic;
      font-weight: 500;
    }
    .dialogue-text {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      flex: 1;
    }
    .dialogue-text.narrator {
      color: var(--muted);
      font-style: italic;
      font-size: 13px;
    }
    .dialogue-hint {
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      letter-spacing: 1px;
      opacity: 0.6;
    }

    /* 移动端对话样式 */
    @media (max-width: 640px) {
      .dialogue-overlay { padding: 12px; }
      .dialogue-box { padding: 12px; gap: 10px; }
      .dialogue-portrait { width: 60px; height: 60px; }
      .dialogue-speaker { font-size: 12px; }
      .dialogue-text { font-size: 13px; }
    }

    /* ===== 弹珠图鉴卡片（在 shop-list 中渲染） ===== */
    .marble-codex-card {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 8px;
      display: flex; gap: 10px;
      align-items: center;
    }
    .marble-codex-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .marble-ball {
      width: 22px; height: 22px;
      border-radius: 50%;
    }
    .marble-codex-body { flex: 1; min-width: 0; }
    .marble-codex-name {
      font-size: 13px; color: var(--text); font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 3px;
    }
    .marble-codex-charges {
      font-size: 10px; color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px; border-radius: 4px;
    }
    .marble-codex-effect {
      font-size: 11px; color: var(--good);
      margin-bottom: 2px;
    }
    .marble-codex-desc {
      font-size: 11px; color: var(--muted);
      line-height: 1.4;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ===== 响应式适配 ===== */
    /* 平板/小桌面：抽屉略窄 */
    @media (max-width: 1024px) {
      #left-panel { width: min(480px, calc(100vw - 24px)); }
    }
    /* 手机横屏：抽屉占满宽度，高度受限 */
    @media (max-width: 900px) {
      #left-panel {
        left: 0;
        width: 100%;
        height: 60vh;
        transform: translateY(calc(100% - 48px));
      }
      #left-panel:not(.collapsed) { transform: translateY(0); }
      .stat-chip { padding: 6px 10px; font-size: 12px; }
      #chapter-tag { font-size: 11px; padding: 6px 10px; }
    }
    /* 手机竖屏：全面优化 */
    @media (max-width: 640px) {
      /* 顶部状态栏：允许换行，避免按钮被裁切够不到 */
      #top-bar {
        gap: 5px;
        top: max(8px, env(safe-area-inset-top));
        left: 8px; right: 8px;
        flex-wrap: wrap;
        overflow: visible;
        padding-right: 44px;
      }
      /* 菜单按钮在移动端单独 fixed 到右上角，永远可达 */
      #btn-menu {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        right: 8px;
        z-index: 70;
        flex-shrink: 0;
      }
      .stat-chip {
        padding: 5px 8px;
        font-size: 11px;
        gap: 4px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .stat-chip svg { width: 11px; height: 11px; }
      .stat-chip .val { min-width: 18px; }
      .stat-chip .rate { font-size: 9px; margin-left: 2px; }
      /* 位数进度条更紧凑 */
      .digit-progress {
        min-width: 52px;
        padding: 4px 6px;
        gap: 2px;
        flex-shrink: 0;
      }
      .dp-head { font-size: 8px; gap: 4px; }
      .dp-track { height: 4px; }
      /* 章节标签隐藏，腾出空间 */
      #chapter-tag { display: none; }
      /* 按钮：只显示图标，触摸热区足够 */
      .icon-btn {
        padding: 7px 9px;
        font-size: 0;
        gap: 0;
        flex-shrink: 0;
      }
      .icon-btn svg { width: 15px; height: 15px; }
      .icon-btn span:not([id^="icon"]) { display: none; }

      /* 抽屉：全宽 + 安全区适配 */
      #left-panel {
        left: 0;
        width: 100%;
        height: 78vh;
        max-height: calc(100vh - env(safe-area-inset-top) - 60px);
        border-radius: 14px 14px 0 0;
        border-left: none;
        border-right: none;
        padding-bottom: env(safe-area-inset-bottom);
        transform: translateY(calc(100% - 52px));
      }
      #left-panel:not(.collapsed) {
        transform: translateY(0);
      }
      /* 标题条：触摸热区 52px */
      .panel-title {
        padding: 16px 16px;
        font-size: 14px;
        min-height: 52px;
      }
      .panel-title svg { width: 16px; height: 16px; }
      .collapse-btn { font-size: 14px; padding: 4px 8px; }
      .panel-body { padding: 10px 12px 12px; }

      /* tab 按钮：触摸热区增大 */
      .tab-row { gap: 5px; margin-bottom: 10px; }
      .tab-btn {
        padding: 9px 4px;
        font-size: 12px;
        min-height: 38px;
      }

      /* 商品卡片：触控优化 */
      #shop-list { grid-template-columns: 1fr !important; gap: 8px; }
      .shop-item, .skill-item {
        padding: 12px;
        margin-bottom: 0;
      }
      .item-head { gap: 10px; margin-bottom: 6px; }
      .item-icon { width: 32px; height: 32px; }
      .item-icon svg { width: 18px; height: 18px; }
      .item-name { font-size: 14px; }
      .item-level { font-size: 11px; padding: 3px 9px; }
      .item-desc { font-size: 12px; margin: 5px 0 8px; }
      .item-cost { font-size: 13px; }
      .item-cost svg { width: 13px; height: 13px; }

      /* 双按钮：高度增大便于触控 */
      .item-actions { gap: 8px; margin-top: 8px; }
      .mini-btn {
        padding: 9px 6px;
        font-size: 12px;
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 模态框：移动端接近全屏 */
      .modal-overlay { padding: 12px; }
      .modal {
        width: 100%;
        max-width: 100%;
        padding: 18px 16px;
        padding-bottom: max(18px, env(safe-area-inset-bottom));
      }
      .modal h3 { font-size: 17px; margin-bottom: 14px; }
      .modal p { font-size: 13px; }
      .modal-actions { gap: 8px; margin-top: 18px; }
      .modal-actions .btn {
        flex: 1;
        padding: 11px 12px;
        font-size: 13px;
        justify-content: center;
        min-height: 44px;
      }

      /* 存档卡片触控优化 */
      .slot-card { padding: 14px; }
      .slot-card-actions .btn {
        min-height: 40px;
        padding: 9px 10px;
      }

      /* toast：避开抽屉标题条 */
      #toast {
        bottom: calc(72px + env(safe-area-inset-bottom));
        font-size: 12px;
        padding: 9px 16px;
        max-width: 88vw;
      }
    }
    /* 极小屏（≤360px）：进一步压缩 */
    @media (max-width: 360px) {
      #top-bar { gap: 4px; left: 6px; right: 6px; }
      .stat-chip { padding: 4px 6px; font-size: 10px; gap: 3px; }
      .stat-chip svg { width: 10px; height: 10px; }
      .stat-chip .rate { display: none; }
      /* 极小屏隐藏位数进度条，腾出空间 */
      .digit-progress { display: none; }
      .icon-btn { padding: 6px 8px; }
      .icon-btn svg { width: 14px; height: 14px; }
      /* 抽屉略矮 */
      #left-panel { height: 80vh; transform: translateY(calc(100% - 50px)); }
      #left-panel:not(.collapsed) { transform: translateY(0); }
      .panel-title { padding: 14px 12px; font-size: 13px; min-height: 50px; }
      /* 商品卡片更紧凑 */
      .shop-item, .skill-item { padding: 10px; }
      .item-icon { width: 28px; height: 28px; }
      .item-name { font-size: 13px; }
      .item-desc { font-size: 11px; }
      .mini-btn { padding: 8px 4px; font-size: 11px; min-height: 36px; }
      .tab-btn { padding: 8px 2px; font-size: 11px; }
    }
    /* 横屏短屏：抽屉高度更小，但仍可滚动 */
    @media (max-height: 500px) and (orientation: landscape) {
      #left-panel {
        left: 0;
        width: 100%;
        height: 85vh;
        max-height: calc(100vh - env(safe-area-inset-top) - 20px);
        transform: translateY(calc(100% - 48px));
      }
      #left-panel:not(.collapsed) { transform: translateY(0); }
      /* 横屏短屏压缩顶部状态栏 */
      #top-bar { gap: 4px; top: max(4px, env(safe-area-inset-top)); }
      .stat-chip { padding: 4px 8px; font-size: 11px; }
      .digit-progress { min-width: 48px; padding: 3px 6px; }
      .dp-head { font-size: 8px; }
      .dp-track { height: 3px; }
      #chapter-tag { display: none; }
    }

    /* 面板切换按钮（默认隐藏，移动端显示） */
    .panel-toggle {
      display: none;
      position: absolute;
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .panel-toggle:hover { background: var(--btn-hover); }
    .panel-toggle svg { width: 14px; height: 14px; }
    #toggle-shop { bottom: 80px; left: 10px; }

    /* ===== 加载动画 ===== */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-title {
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      font-size: clamp(28px, 6vw, 48px);
      color: #ffffff;
      letter-spacing: 4px;
      opacity: 0;
      animation: loaderFadeUp 0.8s ease 0.1s forwards;
    }
    .loader-sub {
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      font-size: clamp(11px, 2.4vw, 16px);
      color: var(--gold);
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0;
      animation: loaderFadeUp 0.8s ease 0.3s forwards;
    }
    .loader-bar {
      width: min(240px, 60vw);
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
      opacity: 0;
      animation: loaderFadeUp 0.6s ease 0.5s forwards;
    }
    .loader-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    @keyframes loaderFadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 主菜单：左侧纵向导航 ===== */
    #menu-ui {
      position: fixed; inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    #menu-ui.hidden { display: none; }
    .menu-nav {
      pointer-events: auto;
      display: flex; flex-direction: column;
      gap: 6px;
      padding: 0 0 0 clamp(48px, 10vw, 140px);
      max-width: 50%;
    }
    .menu-title {
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      color: #ffffff;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      letter-spacing: 4px;
      margin: 0 0 4px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .menu-subtitle {
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      color: var(--gold);
      font-size: clamp(11px, 2vw, 15px);
      letter-spacing: 8px;
      text-transform: uppercase;
      margin: 0 0 28px;
      opacity: 0.9;
    }
    .menu-link {
      pointer-events: auto;
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      color: rgba(255,255,255,0.85);
      font-size: clamp(16px, 2.4vw, 22px);
      letter-spacing: 2px;
      padding: 8px 0;
      cursor: pointer;
      position: relative;
      background: transparent;
      border: none;
      text-align: left;
      transition: color 0.18s ease, padding-left 0.18s ease;
      width: fit-content;
    }
    .menu-link::before {
      content: '';
      position: absolute;
      left: 0; bottom: 6px;
      width: 0; height: 1px;
      background: #ffffff;
      transition: width 0.22s ease;
    }
    .menu-link:hover { color: #ffffff; padding-left: 24px; }
    .menu-link:hover::before { width: 16px; }
    .menu-link.danger { color: rgba(255,107,107,0.8); }
    .menu-link.danger:hover { color: var(--bad); }
    .menu-link.danger::before { background: var(--bad); }
    .menu-slot-hint {
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      color: var(--crystal);
      font-size: clamp(11px, 1.6vw, 13px);
      letter-spacing: 1px;
      margin: 18px 0 0;
      opacity: 0.85;
    }
    .menu-footer {
      position: fixed;
      bottom: 16px; left: clamp(48px, 10vw, 140px);
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
      color: #484f58;
      font-size: 11px;
      z-index: 5;
      pointer-events: none;
    }

    /* 移动端：菜单居中 */
    @media (max-width: 768px) {
      #menu-ui { justify-content: center; }
      .menu-nav {
        padding: 0 24px;
        max-width: 100%;
        align-items: center;
        text-align: center;
      }
      .menu-title { text-align: center; }
      .menu-subtitle { text-align: center; }
      .menu-link { text-align: center; }
      .menu-link::before { left: 50%; transform: translateX(-50%); }
      .menu-link:hover { padding-left: 0; }
      .menu-footer { left: 0; right: 0; text-align: center; }
    }

    /* ===== 章节选择场景 UI ===== */
    #chapter-select-ui {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0a1018 0%, #050709 100%);
      font-family: "Z Labs RoundPix 12px M CN", sans-serif;
    }
    #chapter-select-ui.hidden { display: none; }
    .chapter-select-inner {
      width: min(1100px, 96vw);
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chapter-select-header {
      display: flex;
      justify-content: flex-end;
    }
    .chapter-select-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      overflow-y: auto;
      padding: 4px;
    }
    .chapter-card {
      background: linear-gradient(180deg, rgba(48,54,61,0.35), rgba(20,24,30,0.5));
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .chapter-card:hover { transform: translateY(-2px); border-color: #58a6ff; }
    .chapter-card.locked {
      opacity: 0.55;
      filter: grayscale(0.5);
    }
    .chapter-card.endless {
      background: linear-gradient(180deg, rgba(170,136,255,0.18), rgba(60,40,90,0.4));
      border-color: #a371f7;
    }
    .chapter-card.endless.active {
      border-color: #f0b429;
      box-shadow: 0 0 12px rgba(240,180,41,0.4);
    }
    .chapter-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .chapter-no {
      font-size: 11px;
      color: #8b949e;
      letter-spacing: 1px;
    }
    .chapter-name {
      font-size: 16px;
      color: #f0f6fc;
      font-weight: 600;
    }
    .chapter-card.endless .chapter-name { color: #d2a8ff; }
    .chapter-scene, .chapter-boss, .chapter-target {
      font-size: 12px;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chapter-target { color: #f0b429; }
    .chapter-locked {
      font-size: 12px;
      color: #6e7681;
      text-align: center;
      padding: 8px;
      border: 1px dashed #30363d;
      border-radius: 6px;
      margin-top: 4px;
    }
    .chapter-active {
      font-size: 12px;
      color: #f0b429;
      text-align: center;
      padding: 8px;
      background: rgba(240,180,41,0.1);
      border-radius: 6px;
      margin-top: 4px;
    }
    .chapter-card .btn.primary {
      background: linear-gradient(180deg, #2db7a3, #1c8a7a);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    .chapter-card .btn.primary:hover { filter: brightness(1.15); }
    .chapter-card .btn.endless {
      background: linear-gradient(180deg, #a371f7, #6e40c8);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    .chapter-card .btn.endless:hover { filter: brightness(1.15); }
    @media (max-width: 768px) {
      .chapter-select-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-title">弹珠炼金术</div>
    <div class="loader-sub">Pinball Alchemy</div>
    <div class="loader-bar"><div id="loader-fill" class="loader-bar-fill"></div></div>
  </div>

  <div id="game-root"></div>

  <div id="menu-ui" class="hidden">
    <nav class="menu-nav">
      <h1 class="menu-title">弹珠炼金术</h1>
      <div class="menu-subtitle">Pinball Alchemy</div>
      <button class="menu-link" data-menu="start">开始游戏</button>
      <button class="menu-link" data-menu="chapters">章节选择</button>
      <button class="menu-link" data-menu="slots">选择存档</button>
      <button class="menu-link" data-menu="shop">数晶商店</button>
      <button class="menu-link" data-menu="codex">图鉴</button>
      <button class="menu-link" data-menu="settings">设置</button>
      <button class="menu-link" data-menu="about">关于</button>
      <div id="menu-slot-hint" class="menu-slot-hint"></div>
    </nav>
  </div>

  <!-- 章节选择 UI（由 ChapterSelectScene 控制） -->
  <div id="chapter-select-ui" class="hidden">
    <div class="chapter-select-inner">
      <div class="chapter-select-header">
        <button id="chapter-select-back" class="btn">返回</button>
      </div>
      <div id="chapter-select-list" class="chapter-select-list"></div>
    </div>
  </div>
  <div id="menu-footer" class="menu-footer" style="display:none">v1.4.0 · 3 槽位存档 · 像素风物理弹珠挂机</div>

  <div id="hud" style="display:none">
    <div id="top-bar">
      <div id="gold-digit-progress" class="digit-progress" title="当前金币距离下一个位数的进度">
        <div class="dp-head"><span>下一位</span><span id="dp-target" class="dp-target">10</span></div>
        <div class="dp-track"><div id="dp-fill" class="dp-fill" style="width:0%"></div></div>
      </div>
      <div class="stat-chip gold"><span id="icon-gold"></span>金币 <span id="gold-val" class="val">0</span><span id="gold-rate" class="rate">+0/s</span></div>
      <div class="stat-chip crystal"><span id="icon-crystal"></span>数晶 <span id="crystal-val" class="val">0</span></div>
      <div class="stat-chip ball"><span id="icon-ball"></span>初始 <span id="ball-val" class="val">1</span></div>
      <div id="chapter-tag"><span id="icon-chapter"></span><span id="chapter-name">第 1 章</span><div class="progress"><div id="chapter-progress" class="progress-fill" style="width:0%"></div></div></div>
      <button id="btn-prestige" class="icon-btn prestige-btn" title="清零进入下一个周目" style="display:none;"><span id="icon-prestige2"></span>归零</button>
      <button id="btn-boss" class="icon-btn boss-btn" title="挑战本章 Boss" style="display:none;"><span id="icon-boss"></span>Boss战</button>
      <button id="btn-menu" class="icon-btn"><span id="icon-menu"></span>菜单</button>
    </div>

    <div id="shop-backdrop" class="shop-backdrop"></div>
    <div id="left-panel" class="side-panel collapsed">
      <div class="panel-title"><span id="icon-pegs-dup"></span>商店与技能<span class="collapse-btn">▾</span></div>
      <div class="panel-body">
        <div class="tab-row">
          <button class="tab-btn active" data-tab="pegs">钉子</button>
          <button class="tab-btn" data-tab="autos">自动器</button>
          <button class="tab-btn" data-tab="skills">技能</button>
          <button class="tab-btn" data-tab="global">全局</button>
          <button class="tab-btn" data-tab="marbles">弹珠</button>
        </div>
        <div id="shop-list"></div>
      </div>
    </div>

    <div id="task-hint" class="task-hint"></div>

    <div id="toast"></div>
  </div>

  <div id="modal-prestige" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-prestige"></span>归零试炼</h3>
      <p>累计金币已达到 <span id="prestige-gold" style="color:var(--gold)">0</span>，是否归零进入下一周目？</p>
      <p class="muted">归零后将清空金币、钉子与自动器，但可获得数晶并在永久商店中保留加成。</p>
      <div class="modal-actions">
        <button id="prestige-cancel" class="btn">再想想</button>
        <button id="prestige-confirm" class="btn primary">归零</button>
      </div>
    </div>
  </div>

  <div id="modal-menu" class="modal-overlay">
    <div class="modal">
      <h3><span id="icon-save"></span>菜单</h3>
      <p class="muted">版本 1.2.0 · 自动保存到本地浏览器</p>
      <div class="modal-actions">
        <button id="menu-home" class="btn"><span id="icon-home"></span>返回标题</button>
        <button id="menu-save" class="btn primary"><span id="icon-save2"></span>立即保存</button>
        <button id="menu-wipe" class="btn danger"><span id="icon-trash"></span>清空存档</button>
      </div>
    </div>
  </div>

  <script>
    // 加载动画：等待字体等资源加载完毕再淡出
    (function () {
      const loader = document.getElementById('loader');
      const fill = document.getElementById('loader-fill');
      let progress = 0;
      // 模拟进度推进，避免静止卡顿
      const tick = setInterval(() => {
        progress = Math.min(progress + 8, 90);
        if (fill) fill.style.width = progress + '%';
      }, 120);
      const finish = () => {
        clearInterval(tick);
        if (fill) fill.style.width = '100%';
        setTimeout(() => loader && loader.classList.add('hide'), 200);
      };
      // 等待字体加载完成
      const fontsReady = (document.fonts && document.fonts.ready) || Promise.resolve();
      // 等待 window load（所有资源）
      const loadEvt = new Promise((resolve) => {
        if (document.readyState === 'complete') resolve(null);
        else window.addEventListener('load', resolve, { once: true });
      });
      Promise.all([fontsReady, loadEvt]).then(finish).catch(finish);
      // 兜底：最长 3s 后强制结束
      setTimeout(finish, 3000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
